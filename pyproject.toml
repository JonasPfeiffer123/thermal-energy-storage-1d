[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "thermal-energy-storage-1d"
dynamic = ["version"]
description = "1D finite-volume model of a stratified hot-water thermal energy storage tank"
readme = "README.md"
license = { text = "GPL-3.0-or-later" }
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.20",
    "matplotlib>=3.4",
]

[project.optional-dependencies]
ui = [
    "PyQt6>=6.4.0",
    "matplotlib>=3.7.0",
]
test = [
    "pytest>=7.0",
]

[tool.setuptools.dynamic]
version = { attr = "thermal_energy_storage_model.__version__" }

[tool.setuptools.packages.find]
include = ["thermal_energy_storage_model*"]

[tool.setuptools.package-data]
"thermal_energy_storage_model" = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["error::RuntimeWarning"]
